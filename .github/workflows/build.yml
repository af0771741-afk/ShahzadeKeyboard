name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ShahzadeKeyboard"
          include(":app")
          EOF_FILE
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.shahzade.keyboard"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.shahzade.keyboard"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ShahzadeKeyboardService"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p $(dirname app/src/main/res/xml/method.xml)
          cat > app/src/main/res/xml/method.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.shahzade.keyboard.MainActivity" />
          EOF_FILE
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">کیبورد شاهزاده</string>
          </resources>
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/shahzade/keyboard/MainActivity.kt)
          cat > app/src/main/java/com/shahzade/keyboard/MainActivity.kt <<'EOF_FILE'
          package com.shahzade.keyboard

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                      setPadding(dp(20), dp(40), dp(20), dp(20))
                      setBackgroundColor(Color.rgb(35, 22, 49))
                  }

                  root.addView(TextView(this).apply {
                      text = "کیبورد شاهزاده 🍁"
                      textSize = 26f
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(232, 199, 123))
                  })

                  root.addView(TextView(this).apply {
                      text = "برای استفاده، اول کیبورد را فعال کن، بعد آن را به‌عنوان کیبورد فعلی انتخاب کن."
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setPadding(0, dp(16), 0, dp(16))
                  })

                  fun styledButton(label: String, action: () -> Unit) = Button(this).apply {
                      text = label
                      isAllCaps = false
                      setTextColor(Color.rgb(35, 22, 49))
                      setBackgroundColor(Color.rgb(232, 199, 123))
                      setOnClickListener { action() }
                  }

                  val lp = { LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(52)
                  ).apply { setMargins(0, dp(6), 0, dp(6)) } }

                  root.addView(styledButton("۱) فعال‌سازی کیبورد") {
                      startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS))
                  }, lp())

                  root.addView(styledButton("۲) انتخاب کیبورد") {
                      (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager)
                          .showInputMethodPicker()
                  }, lp())

                  root.addView(EditText(this).apply {
                      hint = "اینجا تست کن..."
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                  }, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = dp(20) })

                  setContentView(root)
              }
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/shahzade/keyboard/ShahzadeKeyboardService.kt)
          cat > app/src/main/java/com/shahzade/keyboard/ShahzadeKeyboardService.kt <<'EOF_FILE'
          package com.shahzade.keyboard

          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.StateListDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class ShahzadeKeyboardService : InputMethodService() {

              private enum class Mode { FA, EN, SYM }

              private var mode = Mode.FA
              private var lastLetterMode = Mode.FA
              private var shift = false
              private val handler = Handler(Looper.getMainLooper())

              private val bgColor = Color.rgb(35, 22, 49)
              private val keyColor = Color.rgb(76, 53, 91)
              private val specialColor = Color.rgb(92, 65, 106)
              private val gold = Color.rgb(232, 199, 123)

              private val faRows = listOf("ضصثقفغعهخحجچ", "شسیبلاتنمکگ", "ظطزرذدپوئژ")
              private val enRows = listOf("qwertyuiop", "asdfghjkl", "zxcvbnm")
              private val symRows = listOf("1234567890", "،؛؟«»!٪-_=", "()@#$&*+/:")

              override fun onCreateInputView(): View = buildKeyboard()

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  if (shift) {
                      shift = false
                      refresh()
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }

              private fun refresh() = setInputView(buildKeyboard())

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              // ---------- ساخت ظاهر ----------

              private fun buildKeyboard(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(4), dp(4), dp(4), dp(6))
                      setBackgroundColor(bgColor)
                  }

                  root.addView(TextView(this).apply {
                      text = if (mode == Mode.EN) "SHAHZADE 🍁" else "کیبورد شاهزاده 🍁"
                      setTextColor(gold)
                      textSize = 13f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(26)
                  ))

                  // ردیف اعداد (در حالت حروف)
                  if (mode == Mode.FA) addRow(root, "۱۲۳۴۵۶۷۸۹۰".map { charKey(it.toString()) }, rtl = true)
                  if (mode == Mode.EN) addRow(root, "1234567890".map { charKey(it.toString()) }, rtl = false)

                  val rows = when (mode) {
                      Mode.FA -> faRows
                      Mode.EN -> enRows
                      Mode.SYM -> symRows
                  }
                  val rtl = mode == Mode.FA

                  rows.forEachIndexed { index, row ->
                      val keys = mutableListOf<Pair<View, Float>>()

                      if (mode == Mode.EN && index == 2) {
                          keys += shiftKey() to 1.5f
                      }
                      row.forEach { c ->
                          val label = if (mode == Mode.EN && shift) c.uppercase() else c.toString()
                          keys += charKey(label, afterType = {
                              if (mode == Mode.EN && shift) {
                                  shift = false
                                  refresh()
                              }
                          }) to 1f
                      }
                      if (index == 2) {
                          keys += deleteKey() to 1.5f
                      }
                      addWeightedRow(root, keys, rtl)
                  }

                  // ردیف پایین
                  val bottom = mutableListOf<Pair<View, Float>>()
                  bottom += makeKey(
                      if (mode == Mode.SYM) (if (lastLetterMode == Mode.FA) "حروف" else "ABC") else "؟۱۲۳",
                      specialColor, gold, 14f
                  ) {
                      if (mode == Mode.SYM) {
                          mode = lastLetterMode
                      } else {
                          lastLetterMode = mode
                          mode = Mode.SYM
                      }
                      shift = false
                      refresh()
                  } to 1.4f

                  bottom += makeKey("🌐", specialColor, Color.WHITE, 18f) {
                      mode = if (mode == Mode.EN) Mode.FA else Mode.EN
                      lastLetterMode = mode
                      shift = false
                      refresh()
                  } to 1f

                  if (mode == Mode.FA) {
                      bottom += makeKey("ZWNJ", specialColor, Color.WHITE, 10f) {
                          commit("\u200C")
                      } to 1f
                  }

                  bottom += charKey(if (mode == Mode.EN) "," else "،") to 1f

                  bottom += makeKey(
                      if (mode == Mode.EN) "space" else "فاصله",
                      specialColor, Color.WHITE, 14f
                  ) { commit(" ") } to 4f

                  bottom += charKey(".") to 1f
                  bottom += makeKey("⏎", gold, bgColor, 20f) { pressEnter() } to 1.5f

                  addWeightedRow(root, bottom, rtl = false)
                  return root
              }

              private fun addRow(root: LinearLayout, keys: List<View>, rtl: Boolean) =
                  addWeightedRow(root, keys.map { it to 1f }, rtl)

              private fun addWeightedRow(root: LinearLayout, keys: List<Pair<View, Float>>, rtl: Boolean) {
                  val line = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      layoutDirection = if (rtl) View.LAYOUT_DIRECTION_RTL else View.LAYOUT_DIRECTION_LTR
                  }
                  keys.forEach { (view, weight) ->
                      line.addView(view, LinearLayout.LayoutParams(0, dp(46), weight).apply {
                          setMargins(dp(2), dp(3), dp(2), dp(3))
                      })
                  }
                  root.addView(line, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ))
              }

              // ---------- انواع کلید ----------

              private fun lighten(c: Int): Int = Color.rgb(
                  minOf(255, Color.red(c) + 45),
                  minOf(255, Color.green(c) + 45),
                  minOf(255, Color.blue(c) + 45)
              )

              private fun keyBackground(fill: Int) = StateListDrawable().apply {
                  fun shape(color: Int) = GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(8).toFloat()
                  }
                  addState(intArrayOf(android.R.attr.state_pressed), shape(lighten(fill)))
                  addState(intArrayOf(), shape(fill))
              }

              private fun makeKey(
                  label: String,
                  fill: Int = keyColor,
                  textColor: Int = Color.WHITE,
                  size: Float = 18f,
                  action: () -> Unit
              ): Button = Button(this).apply {
                  text = label
                  textSize = size
                  isAllCaps = false
                  setTextColor(textColor)
                  minWidth = 0
                  minHeight = 0
                  minimumWidth = 0
                  minimumHeight = 0
                  setPadding(0, 0, 0, 0)
                  stateListAnimator = null
                  background = keyBackground(fill)
                  setOnClickListener {
                      performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                      action()
                  }
              }

              private fun charKey(label: String, afterType: () -> Unit = {}): Button =
                  makeKey(label) {
                      commit(label)
                      afterType()
                  }

              private fun shiftKey(): Button =
                  makeKey("⇧", if (shift) gold else specialColor, if (shift) bgColor else Color.WHITE, 20f) {
                      shift = !shift
                      refresh()
                  }

              private fun deleteKey(): Button {
                  val btn = makeKey("⌫", specialColor, Color.rgb(255, 220, 150), 20f) {}
                  val repeater = object : Runnable {
                      override fun run() {
                          deleteOne()
                          handler.postDelayed(this, 55)
                      }
                  }
                  btn.setOnClickListener(null)
                  btn.setOnTouchListener { v, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              v.isPressed = true
                              v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              deleteOne()
                              handler.postDelayed(repeater, 400)
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              v.isPressed = false
                              handler.removeCallbacks(repeater)
                          }
                      }
                      true
                  }
                  return btn
              }

              // ---------- عملیات ورودی ----------

              private fun commit(text: String) {
                  currentInputConnection?.commitText(text, 1)
              }

              private fun deleteOne() {
                  // اگر متنی انتخاب شده باشد، کل انتخاب پاک می‌شود
                  sendDownUpKeyEvents(KeyEvent.KEYCODE_DEL)
              }

              private fun pressEnter() {
                  val ei = currentInputEditorInfo
                  val action = (ei?.imeOptions ?: 0) and EditorInfo.IME_MASK_ACTION
                  val noEnterAction = ((ei?.imeOptions ?: 0) and EditorInfo.IME_FLAG_NO_ENTER_ACTION) != 0
                  if (!noEnterAction &&
                      action != EditorInfo.IME_ACTION_NONE &&
                      action != EditorInfo.IME_ACTION_UNSPECIFIED
                  ) {
                      currentInputConnection?.performEditorAction(action)
                  } else {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER)
                  }
              }
          }
          EOF_FILE
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShahzadeKeyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
